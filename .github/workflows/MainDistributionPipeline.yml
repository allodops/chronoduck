#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Manual-dispatch only: mature DuckDB extensions (postgres_scanner,
  # sqlite_scanner) run their equivalent of this full multi-platform matrix
  # only on workflow_dispatch, never on every PR/push — the real PR-time
  # gate is the separate, lighter ci.yml (build-test/hygiene). This job is
  # not a required status check, so gating it here costs nothing but the
  # compute it used to spend on every PR for zero merge-gating value.
  duckdb-stable-build:
    name: Build extension binaries
    if: github.event_name == 'workflow_dispatch'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: chronoduck

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: chronoduck
      format_checks: 'format;tidy'

  # No deploy job: `_extension_deploy.yml` uploads to the `duckdb-extensions-nightly` S3
  # bucket using secrets (DUCKDB_EXTENSIONS_NIGHTLY_S3_*) that GitHub only shares with
  # reusable-workflow callers inside the same org as the secret owner — this repo isn't
  # in the duckdb org, so those secrets would reach the deploy script empty. The script
  # itself guards for that (duckdb/scripts/extension-upload-single.sh: "No AWS key
  # found, skipping..", exit 0) — it would run as a silent no-op, not fail — but a
  # no-op that never uploads anywhere this project controls has no value here either.
  # `duckdb-stable-build` above already proves the extension builds and packages
  # correctly (uploaded as a GH Actions artifact); that's this project's dry-run
  # signal until a real distribution channel (community-extensions, T0.11) is wired
  # up — matching duckdb/extension-template's own MainDistributionPipeline.yml, which
  # also omits this job by default.
