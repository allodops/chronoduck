name: nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsan:
    name: tsan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - run: make debug
        env:
          THREADSAN: "1"
      - run: make test_debug

  vector-size-2:
    name: vector-size-2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - run: make debug
        env:
          STANDARD_VECTOR_SIZE: "2"
      - run: make test_debug
