name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A stale PR run is fine to cancel when a new commit supersedes it. A push
  # to main never is: main is also where build-test's ccache gets saved for
  # every other branch to restore from, and a cancelled run never reaches
  # that save step — rapid successive merges were cancelling each other's
  # main-branch run before completion, leaving no cache to inherit.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: make hygiene
      - run: make hygiene-selftest

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Default true (always build): only a `pull_request` run's relevance
    # check below can turn this false. `push`/`merge_group` always build —
    # push-to-main is where build-test's ccache gets saved for every PR to
    # restore from (see the concurrency comment above), and there's no
    # single-PR-diff base to check relevance against for those trigger types
    # anyway (#181).
    env:
      BUILD_RELEVANT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - if: github.event_name == 'pull_request'
        run: make build-relevant-changed
      - if: env.BUILD_RELEVANT == 'true'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ccache-ci-build-test-v1.5.4
          max-size: 5GB
          evict-old-files: job
      - if: env.BUILD_RELEVANT == 'true'
        run: make release
      - if: env.BUILD_RELEVANT == 'true'
        run: make test
      - if: env.BUILD_RELEVANT == 'true'
        run: make smoke

  tsan:
    name: tsan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ccache-ci-tsan-v1.5.4
          max-size: 5GB
          evict-old-files: job
      - run: make debug
        env:
          THREADSAN: "1"
      - run: make test_debug

  chdb-differential:
    name: chdb-differential
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: make chdb-fetch
      - run: make chdb-differential
